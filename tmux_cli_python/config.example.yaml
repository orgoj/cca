# .tmux-cli-python.yaml — Configuration template
# Copy to your project root and customize.

# Session config
session:
  name: cca-myproject
  servers: "web1 web2 db1"

# Validation hooks — run BEFORE command execution
# stdin = command string, exit 0/1/2
validation:
  enabled: true
  hooks:
    - "dippy --cmd-stdin --json --remote"
    # - "another-validator --check"
  confirmation:
    cmd: "zenity --question --text '{message}' --title 'Confirm command'"

# Redaction hooks — run AFTER output capture
# stdin = raw output, stdout = redacted output, exit 0/1/2
redaction:
  enabled: true
  hooks:
    - "secretctl sanitize"
    # - "gitleaks stdin --exit-code 0"
  confirmation:
    cmd: "zenity --question --text '{message}' --title 'Sensitive output'"

# Audit trail
audit:
  enabled: true
  dir: logs

# Legacy logging (backward compat)
logging:
  enabled: false
  admin_name: ""
