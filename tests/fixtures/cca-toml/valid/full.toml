# Every v1 table and key with non-default values.
schema_version = 1

[servers.server1]
ssh = "admin@server1.example.com"
netdata_host = "203.0.113.10"
netdata_port = 19998
netdata_transport = "ssh"

[servers.server2]
netdata_host = "2001:db8::2"
netdata_transport = "direct"

[servers.server3]

[run]
transport = "ssh"
tokf = true

[run.tmux]
session = "cca-example"

[run.log]
dir = "logs"
operator = "admin1"

[secrets]
curl = "secrets/curl.secret.yaml"
cloudflare = "secrets/cf/cloudflare.secret.yaml"

[netdata]
fping_cache_dir = "server-logs/fping"
fping_target = "gateway1"

[cloudflare]
export_dir = "tmp/cloudflare"
api_base = "https://api.cloudflare.com/client/v4"

[check_domain]
our_ips = ["203.0.113.10", "203.0.113.11", "2001:db8::10"]
hosting_marker = "/.example.hosting.info.txt"

[server_info]
net_iface_prefixes = ["en", "eth", "wg"]

[ioc]
hosts = ["server1", "server2"]
transport = "run"
sudo = true
script = "ansible/roles/host-ioc/files/host-ioc"
quick_interval_hours = 6
deep_interval_hours = 24
baseline_dir = "tmp/host-ioc"
