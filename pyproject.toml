[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tmux-cli-python"
version = "0.1.0"
description = "Python rewrite of cca-tmux-cli with hook pipeline and audit trail"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Michael Heca", email = "michael.heca@gmail.com"},
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "libtmux>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
tmux-cli-python = "tmux_cli_python.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --ignore=tests/test_watchlist.py"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
