[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cca"
version = "1.1.0"
description = "Cyber-CLI Admin toolkit: server administration commands for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Michael Heca", email = "michael.heca@gmail.com"},
]
dependencies = [
    "cloudflare>=5.9.0,<6",
    "dnspython>=2.7,<3",
]

[project.scripts]
cca = "cca.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cca"]

[tool.hatch.build.targets.sdist]
only-include = ["src/cca", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
# Tests of the legacy bin/ scripts; they go away with their ports
extend-exclude = ["tests/test_asn_wrap.py", "tests/test_watchlist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
