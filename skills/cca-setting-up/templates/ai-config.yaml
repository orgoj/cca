# AI Features Configuration
# CCA (Claude Code Admin) - Infrastructure Management System

# Confidence thresholds for auto-resolution
confidence:
  auto_resolve_threshold: 0.80  # 80% confidence required for auto-resolution
  suggest_threshold: 0.70       # 70% for suggesting solution
  manual_threshold: 0.70        # Below 70% requires manual investigation

# Confidence scoring weights
scoring:
  similarity_weight: 0.40       # Weight for similarity to known incident (40%)
  context_match_weight: 0.30    # Weight for context matching (30%)
  success_rate_weight: 0.30     # Weight for historical success rate (30%)

# Safety rules for auto-resolution
safety:
  # Dangerous patterns that NEVER auto-execute
  dangerous_patterns:
    - "rm -rf"              # Recursive force delete
    - "kill -9"             # Force kill processes
    - "systemctl stop"      # Stop services
    - ">> /etc/"            # Append to system config
    - "docker rm -f"        # Force remove containers
    - "zfs destroy"         # Destroy ZFS datasets
    - "> /"                 # Redirect to root paths
    - "dd if="              # Disk operations
    - "mkfs"                # Format filesystem
    - "fdisk"               # Partition operations

  # Safe operations OK for auto-resolution
  safe_operations:
    - "apache2ctl graceful"     # Graceful Apache reload
    - "apache2ctl reload"       # Apache configuration reload
    - "docker restart"          # Restart specific container
    - "systemctl reload"        # Reload service config
    - "systemctl status"        # Check service status
    - "docker logs"             # Read container logs
    - "journalctl"              # Read system logs (read-only)

  # Peak traffic times (require manual approval)
  peak_hours:
    weekdays: ["09:00", "17:00"]  # Business hours, Monday-Friday
    weekends: []                   # No restrictions on weekends

  # Servers requiring extra caution (customize from servers.json)
  critical_servers: []  # Add your critical servers here

  # Auto-resolution not allowed on critical servers unless explicitly requested
  critical_require_manual: true

# Learning settings
learning:
  # Minimum incidents to form cluster (higher = stricter)
  cluster_min_size: 3

  # Similarity threshold for clustering (0.0-1.0, higher = stricter matching)
  cluster_similarity: 0.70

  # Pattern frequency threshold for suggestions (higher = less noise)
  pattern_min_frequency: 3

  # Incident analysis timeframe (days)
  default_timeframe: 30

# Incident documentation
incidents:
  # Auto-generate incident files
  auto_document: true

  # Template for incident filename
  filename_pattern: "incidents/{date}-{brief-description}.md"

  # Required metadata fields in YAML frontmatter
  required_metadata:
    - date          # YYYY-MM-DD
    - servers       # List of affected servers
    - severity      # critical|high|medium|low
    - status        # resolved|investigating|monitoring

  # Track resolution outcomes for learning
  track_outcomes: true

# Diagnostic data gathering
diagnostics:
  # Commands to run for system state (always executed)
  system_commands:
    - "uptime"
    - "free -h"
    - "df -h"
    - "cat /proc/loadavg"

  # Service-specific commands (based on keywords in symptom)
  # Customize based on your infrastructure
  service_commands:
    apache:
      - "apache2ctl fullstatus"
      - "apache2ctl status"
    docker:
      - "docker ps"
      - "docker stats --no-stream"
    nginx:
      - "nginx -t"
      - "systemctl status nginx"

  # Max recent commands to extract from logs
  recent_commands_limit: 20

# Feature flags (enable/disable features)
features:
  auto_resolution: true        # Enable auto-resolution workflow
  learning: true               # Enable knowledge evolution
  incident_auto_document: true # Auto-create incident files

# Tuning notes:
#
# Confidence thresholds:
#   - Higher = more conservative (fewer auto-resolutions, but safer)
#   - Lower = more aggressive (more auto-resolutions, but riskier)
#   - Recommended range: 0.75-0.90 for auto_resolve_threshold
#
# Scoring weights:
#   - Adjust based on what you trust more
#   - Must sum to 1.0
#
# Learning cluster_min_size:
#   - Lower (2): More guides created, but may include noise
#   - Higher (5): Fewer guides, but more reliable patterns
#   - Recommended: 3 for good balance
